server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (o Vite gera um hash novo a cada build, ex: index-BT6Khj6G.js) —
    # podem ficar em cache "pra sempre" sem risco: se o conteúdo mudar, o nome do arquivo muda
    # junto, nunca serve conteúdo velho com nome novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA com react-router (BrowserRouter): qualquer rota que não bata em um arquivo estático
    # cai no index.html, senão dar F5 numa rota tipo /casadapizza/checkout retorna 404.
    location / {
        try_files $uri $uri/ /index.html;

        # O index.html é o oposto dos arquivos com hash: é sempre o mesmo nome, mas o conteúdo
        # muda a cada deploy (aponta pro JS/CSS novo). Sem isso, o navegador podia decidir sozinho
        # confiar numa cópia antiga por um tempo indeterminado (cache heurístico, sem Cache-Control
        # explícito) — foi a causa de um deploy não aparecer atualizado mesmo com F5 forçado.
        add_header Cache-Control "no-cache" always;
    }
}
