server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA com react-router (BrowserRouter): qualquer rota que não bata em um arquivo estático
    # cai no index.html, senão dar F5 numa rota tipo /casadapizza/checkout retorna 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
